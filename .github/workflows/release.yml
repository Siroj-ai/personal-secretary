name: Release Signed OTA APK

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v (e.g. 1.0.1)"
        required: true
        type: string
      notes:
        description: "Optional changelog highlights"
        required: false
        default: "Routine OTA improvements and fixes."
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version tag
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CLEAN="${{ inputs.version }}"
            CLEAN="${CLEAN#v}"
            TAG="v${CLEAN}"
          else
            TAG="${GITHUB_REF_NAME}"
            CLEAN="${TAG#v}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${CLEAN}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Decode release keystore from secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERROR: Missing ANDROID_KEYSTORE_BASE64 repository secret."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/release.jks"

      - name: Build signed release APK
        env:
          RELEASE_VERSION_NAME: ${{ steps.ver.outputs.version }}
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare OTA release artifact & SHA-256
        id: pkg
        shell: bash
        run: |
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          APK_OUT="PersonalSecretary-${{ steps.ver.outputs.tag }}.apk"
          cp "$APK_SRC" "$APK_OUT"
          SHA=$(sha256sum "$APK_OUT" | awk '{print $1}')
          echo "${SHA}  ${APK_OUT}" > "${APK_OUT}.sha256"
          echo "apk=${APK_OUT}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release for OTA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Personal Secretary ${{ steps.ver.outputs.tag }}
          body: |
            ${{ inputs.notes || 'Personal Secretary signed OTA release.' }}

            **OTA Verification**
            - Version: `${{ steps.ver.outputs.version }}`
            - SHA256: `${{ steps.pkg.outputs.sha256 }}`
          files: |
            ${{ steps.pkg.outputs.apk }}
            ${{ steps.pkg.outputs.apk }}.sha256
